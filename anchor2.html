<html lang="ko">

  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">

    body {
      font-family: 'Nanum Gothic', sans-serif;
      background-color: #f0fdf4;
      background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .fancy-title {
      font-family: 'Gaegu', cursive;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse-bgm {
      animation: pulseGreen 2s infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #86efac;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4ade80;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-6 text-gray-800">

  <!-- Main Container -->
  <div class="w-full max-w-3xl bg-white rounded-3xl shadow-xl border-4 border-green-200 overflow-hidden flex flex-col my-auto">
    
    <!-- Top Header & Progress -->
    <header class="bg-green-100 p-4 md:p-5 border-b border-green-200 relative">
      <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
        <div class="flex items-center gap-2">

          <h1 class="text-2xl md:text-3xl font-extrabold text-green-800 fancy-title">Starting a Recycling Project</h1>
        </div>
        
        <div class="flex items-center gap-2">

            <span id="bgmIcon">🌲</span>
            <span id="bgmText">숲속 BGM 켜기</span>

          <!-- Score Badge -->
          <span class="bg-green-600 text-white text-xs md:text-sm font-bold px-3 py-1.5 rounded-full shadow-sm" id="scoreDisplay">점수: 0 점</span>
        </div>
      </div>

      <!-- Voice Settings Bar -->
      <div class="bg-white/80 rounded-xl px-3 py-2 mb-3 flex flex-wrap items-center justify-between gap-2 text-xs border border-green-200">
        <div class="flex items-center gap-1.5 font-bold text-green-900">

    <!-- Word Overlay Dict Modal -->

      <button id="nextBtn" onclick="nextStep()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2.5 px-6 rounded-xl shadow-md transition-all">다음 단계로 ➔</button>

  <!-- Web Audio API (Sound Effects & Generative Forest BGM) + Web Speech API (TTS) -->
  <script>
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // --- 1. Forest Ambient BGM Synthesizer ---
    let isBgmPlaying = false;
    let bgmInterval = null;
    let birdInterval = null;
    let windNodes = null;

    function startForestBGM() {
      const ctx = getAudioCtx();
      if (isBgmPlaying) return;
      isBgmPlaying = true;

      // Update UI
      const btn = document.getElementById('bgmBtn');
      btn.classList.add('bg-green-600', 'text-white', 'pulse-bgm');
      btn.classList.remove('bg-white', 'text-green-800');
      document.getElementById('bgmIcon').innerText = '🍃';
      document.getElementById('bgmText').innerText = '숲속 BGM 켜짐';

      // 1) Gentle Forest Wind / Rustling Leaves (Filtered Pink-ish Noise + LFO)
      const bufferSize = ctx.sampleRate * 3;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        output[i] *= 0.04;
        b6 = white * 0.115926;
      }

      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 400;
      filter.Q.value = 1.5;

      // LFO to modulate wind breeze
      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.18; // Slow breeze every ~5.5 seconds
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 220;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      const windGain = ctx.createGain();
      windGain.gain.value = 0.12; // Soft background level

      whiteNoise.connect(filter);
      filter.connect(windGain);
      windGain.connect(ctx.destination);

      whiteNoise.start();
      lfo.start();
      windNodes = { whiteNoise, lfo, windGain };

      // 2) Peaceful Pentatonic Kalimba / Marimba Forest Melody
      const pentatonicNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25]; // C4, D4, E4, G4, A4, C5, D5, E5
      const playForestNote = () => {
        if (!isBgmPlaying) return;
        const now = ctx.currentTime;
        const freq = pentatonicNotes[Math.floor(Math.random() * pentatonicNotes.length)];
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.045, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 2.4);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 2.5);

        // Occasional harmony fifth/octave note
        if (Math.random() > 0.55) {
          setTimeout(() => {
            if (!isBgmPlaying) return;
            const now2 = ctx.currentTime;
            const freq2 = pentatonicNotes[Math.floor(Math.random() * pentatonicNotes.length)];
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(freq2, now2);
            gain2.gain.setValueAtTime(0.001, now2);
            gain2.gain.linearRampToValueAtTime(0.025, now2 + 0.08);
            gain2.gain.exponentialRampToValueAtTime(0.0008, now2 + 2.0);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now2);
            osc2.stop(now2 + 2.1);
          }, 450);
        }
      };

      playForestNote();
      bgmInterval = setInterval(playForestNote, 1800);

      // 3) Gentle Forest Bird Chirps
      const playBirdChirp = () => {
        if (!isBgmPlaying) return;
        if (Math.random() > 0.65) return; // Random timing
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';

        const baseFreq = 2200 + Math.random() * 700;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq + 550, now + 0.07);
        osc.frequency.exponentialRampToValueAtTime(baseFreq - 150, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(baseFreq + 700, now + 0.22);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.018, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      };
      birdInterval = setInterval(playBirdChirp, 3200);
    }

    function stopForestBGM() {
      isBgmPlaying = false;
      if (bgmInterval) clearInterval(bgmInterval);
      if (birdInterval) clearInterval(birdInterval);
      if (windNodes) {
        try {
          windNodes.whiteNoise.stop();
          windNodes.lfo.stop();
          windNodes.windGain.disconnect();
        } catch (e) {}
        windNodes = null;
      }

      const btn = document.getElementById('bgmBtn');
      btn.classList.remove('bg-green-600', 'text-white', 'pulse-bgm');
      btn.classList.add('bg-white', 'text-green-800');
      document.getElementById('bgmIcon').innerText = '🌲';
      document.getElementById('bgmText').innerText = '숲속 BGM 켜기';
    }

    function toggleForestBGM() {
      if (isBgmPlaying) {
        stopForestBGM();
      } else {
        startForestBGM();
      }
    }

    // --- 2. Sound Effects ---
    function playSound(type) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'click') {
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } else if (type === 'success') {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } else if (type === 'fail') {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.setValueAtTime(196, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } else if (type === 'victory') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, index) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.12);
          g.gain.setValueAtTime(0.11, ctx.currentTime + index * 0.12);
          g.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + index * 0.12 + 0.3);
          o.start(ctx.currentTime + index * 0.12);
          o.stop(ctx.currentTime + index * 0.12 + 0.35);
        });
      }
    }

    // --- 3. Native English Speech (Web Speech API TTS) ---
    let currentSpeechRate = 1.0;
    let availableVoices = [];

    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function setSpeechRate(rate) {
      currentSpeechRate = rate;
      const slowBtn = document.getElementById('rateSlow');
      const normBtn = document.getElementById('rateNormal');
      if (rate === 0.85) {
        slowBtn.className = "px-2 py-0.5 rounded bg-green-600 text-white font-bold transition";
        normBtn.className = "px-2 py-0.5 rounded bg-gray-100 hover:bg-green-100 text-gray-700 font-semibold transition";
      } else {
        normBtn.className = "px-2 py-0.5 rounded bg-green-600 text-white font-bold transition";
        slowBtn.className = "px-2 py-0.5 rounded bg-gray-100 hover:bg-green-100 text-gray-700 font-semibold transition";
      }
    }

    function speakText(text, event) {
      if (event) event.stopPropagation();
      if (!('speechSynthesis' in window)) {
        alert("이 브라우저는 음성 합성(TTS)을 지원하지 않습니다.");
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const accent = document.getElementById('voiceSelect') ? document.getElementById('voiceSelect').value : 'US';
      utterance.lang = accent === 'GB' ? 'en-GB' : 'en-US';
      utterance.rate = currentSpeechRate;

      // Pick high-quality native voice if available
      if (availableVoices.length === 0) {
        availableVoices = window.speechSynthesis.getVoices();
      }
      const targetLang = accent === 'GB' ? 'en-GB' : 'en-US';
      const preferredVoice = availableVoices.find(v => v.lang.includes(targetLang) && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel'))) 
                          || availableVoices.find(v => v.lang.includes(targetLang))
                          || availableVoices.find(v => v.lang.startsWith('en'));
      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    const fullPassageText = "A group of students wanted to find out how much waste their school produced each day. They decided to set up recycling boxes for paper and plastic. They also asked classmates to sort out their waste carefully. At first, many students did not pay attention to the recycling signs, so the team came up with a simple points game. With more students joining the project, the team was able to carry out the plan for an entire month.";
  </script>

        text: "With more students joining, the team was able to <span class='border-b-2 border-dashed border-green-600 px-6 py-1 bg-green-50 mx-1 rounded text-green-800 font-bold min-w-[100px] inline-block text-center' id='blank-5'>?</span> the plan.",
        fullSentence: "With more students joining, the team was able to carry out the plan.",
        translation: "더 많은 학생들이 참여하면서, 그 팀은 그 계획을 <strong>수행(실행)할</strong> 수 있었다.",
        correct: "carry out"
      }
    ];

    let currentStep = 1;
    let score = 0;

    // Step 2 Matching state
    let activeEngCard = null;
    let activeKoCard = null;
    let matchedPairs = 0;

    // Step 3 Quiz State
    let quizIndex = 0;
    let selectedOption = null;

    function setScore(points) {
      score = points;
      document.getElementById('scoreDisplay').innerText = `점수: ${score} 점`;
    }

    function showDict(word) {
      const info = vocabData[word];
      document.getElementById('dictTitle').innerText = word;
      document.getElementById('dictMeaning').innerText = info.ko;
      document.getElementById('dictExampleEn').innerText = info.exampleEn;
      document.getElementById('dictExampleKo').innerText = info.exampleKo;

      document.getElementById('dictSpeakWordBtn').onclick = (e) => speakText(word, e);
      document.getElementById('dictSpeakExBtn').onclick = (e) => speakText(info.exampleEn, e);

      const dict = document.getElementById('quickDict');
      dict.classList.remove('hidden');
      dict.classList.add('flex');

      // Automatically speak the target expression when opening dictionary modal
      speakText(word);
    }

    function closeDict() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      const dict = document.getElementById('quickDict');
      dict.classList.add('hidden');
      dict.classList.remove('flex');
    }

    function renderStep() {
      const container = document.getElementById('activityContainer');
      const nextBtn = document.getElementById('nextBtn');
      const prevBtn = document.getElementById('prevBtn');

      for (let i = 1; i <= 3; i++) {
        const label = document.getElementById(`stepLabel${i}`);
        if (i === currentStep) {
          label.classList.add('text-green-700', 'font-bold', 'scale-105');
          label.classList.remove('text-gray-500');
        } else {
          label.classList.remove('text-green-700', 'font-bold', 'scale-105');
          label.classList.add('text-gray-500');
        }
      }

      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = `${(currentStep / 3) * 100}%`;

      if (currentStep === 1) {
        prevBtn.classList.add('invisible');
        nextBtn.innerText = "단어 맞추기 게임으로 ➔";
        
        container.innerHTML = `
          <div class="fade-in space-y-5">
            <div class="bg-green-50 p-4 rounded-xl border border-green-100 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-start gap-3">
                <span class="text-2xl mt-0.5">📖</span>
                <div>
                  <h3 class="font-bold text-green-950 text-base md:text-lg">1. 본문을 읽으며 원어민 발음과 뜻을 확인해 보세요!</h3>
                  <p class="text-xs md:text-sm text-green-800 mt-0.5">노란색 핵심 표현을 클릭하면 <strong>원어민 음성</strong>이 재생되고 뜻과 예문이 나타납니다.</p>
                </div>
              </div>
              <button onclick="speakText(fullPassageText, event)" class="bg-green-600 hover:bg-green-700 text-white text-xs md:text-sm font-bold px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5 shrink-0">
                🔊 본문 전체 듣기
              </button>
            </div>

            <div class="relative bg-amber-50 p-5 md:p-6 rounded-2xl border-2 border-amber-200/70 shadow-inner text-gray-700 text-base md:text-lg leading-relaxed font-normal">
              <div class="absolute -top-3 left-6 bg-amber-200 text-amber-900 font-bold px-3 py-0.5 rounded-full text-xs shadow-sm">
                Starting a Recycling Project
              </div>
              <p>
                A group of students wanted to 
                <button onclick="showDict('find out')" class="mx-1 px-1.5 bg-yellow-200 hover:bg-yellow-300 border-b-2 border-yellow-500 font-bold text-green-900 rounded cursor-pointer transition-colors inline-flex items-center gap-1">find out <span class="text-xs">🔊</span></button> 
                how much waste their school produced each day. They decided to 
                <button onclick="showDict('set up')" class="mx-1 px-1.5 bg-yellow-200 hover:bg-yellow-300 border-b-2 border-yellow-500 font-bold text-green-900 rounded cursor-pointer transition-colors inline-flex items-center gap-1">set up <span class="text-xs">🔊</span></button> 
                recycling boxes for paper and plastic. 
              </p>
              <p class="mt-3">
                They also asked classmates to 
                <button onclick="showDict('sort out')" class="mx-1 px-1.5 bg-yellow-200 hover:bg-yellow-300 border-b-2 border-yellow-500 font-bold text-green-900 rounded cursor-pointer transition-colors inline-flex items-center gap-1">sort out <span class="text-xs">🔊</span></button> 
                their waste carefully. At first, many students did not 
                <button onclick="showDict('pay attention to')" class="mx-1 px-1.5 bg-yellow-200 hover:bg-yellow-300 border-b-2 border-yellow-500 font-bold text-green-900 rounded cursor-pointer transition-colors inline-flex items-center gap-1">pay attention to <span class="text-xs">🔊</span></button> 
                the recycling signs, so the team 
                <button onclick="showDict('come up with')" class="mx-1 px-1.5 bg-yellow-200 hover:bg-yellow-300 border-b-2 border-yellow-500 font-bold text-green-900 rounded cursor-pointer transition-colors inline-flex items-center gap-1">came up with <span class="text-xs">🔊</span></button> 
                a simple points game. With more students joining the project, the team was able to 
                <button onclick="showDict('carry out')" class="mx-1 px-1.5 bg-yellow-200 hover:bg-yellow-300 border-b-2 border-yellow-500 font-bold text-green-900 rounded cursor-pointer transition-colors inline-flex items-center gap-1">carry out <span class="text-xs">🔊</span></button> 
                the plan for an entire month.
              </p>
            </div>

            <div>
              <h4 class="text-xs font-bold text-gray-500 mb-2 px-1">👇 핵심 표현 6개 (스피커 버튼을 누르면 원어민 발음만 바로 들을 수 있어요)</h4>
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                ${Object.keys(vocabData).map(word => `
                  <div class="bg-white hover:bg-green-50 border border-green-200 rounded-xl p-2.5 flex items-center justify-between shadow-sm transition-all">
                    <button onclick="showDict('${word}')" class="text-left flex-1">
                      <span class="font-extrabold text-green-900 text-sm md:text-base block">${word}</span>
                      <span class="text-gray-500 text-xs">${vocabData[word].ko}</span>
                    </button>
                    <button onclick="speakText('${word}', event)" title="원어민 발음 듣기" class="bg-green-100 hover:bg-green-300 text-green-800 p-2 rounded-lg text-sm font-bold transition shrink-0 ml-2">
                      🔊
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } 
      
      else if (currentStep === 2) {
        prevBtn.classList.remove('invisible');
        nextBtn.innerText = "도전! 문장 퀴즈로 ➔";
        
        matchedPairs = 0;
        activeEngCard = null;
        activeKoCard = null;

        const engCards = Object.keys(vocabData).map(key => ({ id: key, text: key }));
        const koCards = Object.keys(vocabData).map(key => ({ id: key, text: vocabData[key].ko }));
        
        shuffle(engCards);
        shuffle(koCards);

        container.innerHTML = `
          <div class="fade-in space-y-4">
            <div class="bg-green-50 p-4 rounded-xl border border-green-100 flex items-start gap-3">
              <span class="text-2xl mt-0.5">🎮</span>
              <div>
                <h3 class="font-bold text-green-950 text-base md:text-lg">2. 단어 짝 맞추기 게임</h3>
                <p class="text-sm text-green-800 mt-0.5">영어 카드를 누르면 <strong>원어민 발음</strong>이 나옵니다. 알맞은 한국어 뜻 카드와 짝을 맞춰보세요!</p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4 md:gap-6 pt-2">
              <!-- English cards -->
              <div class="space-y-2.5" id="engCardContainer">
                <h4 class="text-center font-bold text-green-800 border-b pb-2">English (클릭 시 발음 재생 🔊)</h4>
                ${engCards.map(item => `
                  <button id="eng-${item.id}" onclick="clickEngCard('${item.id}')" class="w-full bg-white hover:bg-gray-50 border-2 border-gray-200/80 hover:border-green-400 py-3 px-4 rounded-xl font-bold text-sm md:text-base text-gray-700 shadow-sm transition-all outline-none flex items-center justify-between">
                    <span>${item.text}</span>
                    <span class="text-xs text-green-600">🔊</span>
                  </button>
                `).join('')}
              </div>

              <!-- Korean cards -->
              <div class="space-y-2.5" id="koCardContainer">
                <h4 class="text-center font-bold text-green-800 border-b pb-2">한국어 뜻</h4>
                ${koCards.map(item => `
                  <button id="ko-${item.id}" onclick="clickKoCard('${item.id}')" class="w-full bg-white hover:bg-gray-50 border-2 border-gray-200/80 hover:border-green-400 py-3 px-4 rounded-xl font-bold text-[13px] md:text-base text-gray-700 shadow-sm transition-all outline-none">
                    ${item.text}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } 
      
      else if (currentStep === 3) {
        prevBtn.classList.remove('invisible');
        nextBtn.innerText = "결과 제출하기 🎉";
        quizIndex = 0;
        renderQuiz();
      }
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // Step 2 Game Logic
    function clickEngCard(id) {
      if (document.getElementById(`eng-${id}`).disabled) return;
      
      // Speak word aloud when clicking the English card
      speakText(id);

      if (activeEngCard) {
        document.getElementById(`eng-${activeEngCard}`).classList.remove('border-green-500', 'bg-green-50/70', 'scale-[1.02]');
        document.getElementById(`eng-${activeEngCard}`).classList.add('border-gray-200/80', 'bg-white');
      }
      activeEngCard = id;
      const el = document.getElementById(`eng-${id}`);
      el.classList.remove('border-gray-200/80', 'bg-white');
      el.classList.add('border-green-500', 'bg-green-50/70', 'scale-[1.02]');

      checkMatch();
    }

    function clickKoCard(id) {
      playSound('click');
      if (document.getElementById(`ko-${id}`).disabled) return;

      if (activeKoCard) {
        document.getElementById(`ko-${activeKoCard}`).classList.remove('border-green-500', 'bg-green-50/70', 'scale-[1.02]');
        document.getElementById(`ko-${activeKoCard}`).classList.add('border-gray-200/80', 'bg-white');
      }
      activeKoCard = id;
      const el = document.getElementById(`ko-${id}`);
      el.classList.remove('border-gray-200/80', 'bg-white');
      el.classList.add('border-green-500', 'bg-green-50/70', 'scale-[1.02]');

      checkMatch();
    }

    function checkMatch() {
      if (!activeEngCard || !activeKoCard) return;

      if (activeEngCard === activeKoCard) {
        playSound('success');
        const engBtn = document.getElementById(`eng-${activeEngCard}`);
        const koBtn = document.getElementById(`ko-${activeKoCard}`);

        [engBtn, koBtn].forEach(btn => {
          btn.disabled = true;
          btn.classList.remove('border-green-500', 'bg-green-50/70', 'scale-[1.02]');
          btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'line-through', 'opacity-60');
        });

        matchedPairs++;
        setScore(score + 10);

        if (matchedPairs === 6) {
          setTimeout(() => {
            playSound('victory');
            alert("참 잘했어요! 모든 카드 맞추기 미션을 완료하셨습니다. 이제 마지막 퀴즈 단계로 넘어가보세요!");
          }, 400);
        }
      } else {
        playSound('fail');
        const badEng = activeEngCard;
        const badKo = activeKoCard;
        const engBtn = document.getElementById(`eng-${badEng}`);
        const koBtn = document.getElementById(`ko-${badKo}`);

        [engBtn, koBtn].forEach(btn => {
          btn.classList.remove('border-green-500', 'bg-green-50/70', 'scale-[1.02]');
          btn.classList.add('border-red-400', 'bg-red-50');
        });

        setTimeout(() => {
          [engBtn, koBtn].forEach(btn => {
            btn.classList.remove('border-red-400', 'bg-red-50');
            btn.classList.add('border-gray-200/80', 'bg-white');
          });
        }, 500);
      }

      activeEngCard = null;
      activeKoCard = null;
    }

    // Step 3 Quizzes Layout
    function renderQuiz() {
      const container = document.getElementById('activityContainer');
      const curQuiz = quizQuestions[quizIndex];
      selectedOption = null;

      let choices = [curQuiz.correct];
      const otherKeys = Object.keys(vocabData).filter(k => k !== curQuiz.correct);
      shuffle(otherKeys);
      choices.push(otherKeys[0], otherKeys[1]);
      shuffle(choices);

      container.innerHTML = `
        <div class="fade-in space-y-4">
          <div class="bg-green-50 p-4 rounded-xl border border-green-100 flex items-start justify-between">
            <div class="flex items-start gap-3">
              <span class="text-2xl mt-0.5">📝</span>
              <div>
                <h3 class="font-bold text-green-950 text-base md:text-lg">3. 도전! 문장 완성하기 (문항 ${quizIndex + 1}/6)</h3>
                <p class="text-xs md:text-sm text-green-800 mt-0.5">문장의 빈칸에 들어갈 알맞은 표현을 고르세요. 보기를 누르면 발음을 들을 수 있습니다.</p>
              </div>
            </div>
            <span class="text-xs font-bold text-green-700 bg-green-200/50 px-2.5 py-1 rounded-md shrink-0">남은 문제: ${6 - quizIndex}개</span>
          </div>

          <!-- Question Content -->
          <div class="bg-gray-50 border border-gray-200/75 p-6 rounded-2xl shadow-inner space-y-4">
            <div class="flex justify-between items-start gap-2">
              <p class="text-base md:text-lg leading-relaxed text-gray-800 font-semibold" id="questionText">
                ${curQuiz.text}
              </p>
              <button onclick="speakText('${curQuiz.fullSentence}', event)" title="문장 전체 발음 힌트 듣기" class="bg-green-100 hover:bg-green-200 text-green-800 px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 transition">
                🔊 문장 듣기
              </button>
            </div>
            <p class="text-sm text-gray-500 border-l-4 border-gray-300 pl-3 italic">
              해석: ${curQuiz.translation}
            </p>
          </div>

          <!-- Selection List -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
            ${choices.map(opt => `
              <button onclick="selectOption('${opt}')" id="opt-${opt}" class="bg-white hover:bg-gray-50 border-2 border-gray-200/80 py-3.5 px-4 rounded-2xl font-extrabold text-sm md:text-base text-gray-700 shadow-sm transition-all hover:scale-[1.01] flex items-center justify-center gap-2">
                <span>${opt}</span>
                <span class="text-xs text-green-600">🔊</span>
              </button>
            `).join('')}
          </div>

          <div class="flex justify-end pt-3">
            <button onclick="checkQuizAnswer()" id="submitQuizBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-8 rounded-xl shadow-md transition-all">정답 확인하기</button>
          </div>
        </div>
      `;
    }

    function selectOption(opt) {
      speakText(opt);
      selectedOption = opt;
      const options = document.querySelectorAll('[id^="opt-"]');
      options.forEach(btn => {
        btn.classList.remove('border-green-500', 'bg-green-50/50', 'text-green-800');
        btn.classList.add('border-gray-200/80', 'bg-white', 'text-gray-700');
      });

      const selBtn = document.getElementById(`opt-${opt}`);
      selBtn.classList.remove('border-gray-200/80', 'bg-white', 'text-gray-700');
      selBtn.classList.add('border-green-500', 'bg-green-50/50', 'text-green-800');
    }

    function checkQuizAnswer() {
      if (!selectedOption) {
        alert("먼저 정답 후보 중 하나를 골라주세요!");
        return;
      }

      const curQuiz = quizQuestions[quizIndex];
      const optBtn = document.getElementById(`opt-${selectedOption}`);
      const submitBtn = document.getElementById('submitQuizBtn');
      const blank = document.getElementById(`blank-${quizIndex}`);

      const options = document.querySelectorAll('[id^="opt-"]');
      options.forEach(btn => btn.disabled = true);

      if (selectedOption === curQuiz.correct) {
        playSound('success');
        speakText(curQuiz.fullSentence);
        optBtn.classList.remove('border-green-500', 'bg-green-50/50');
        optBtn.classList.add('bg-green-200', 'border-green-600', 'text-green-900');
        setScore(score + 15);

        if (blank) {
          blank.innerText = selectedOption;
          blank.classList.remove('border-dashed', 'bg-green-50');
          blank.classList.add('bg-green-200', 'border-solid', 'text-green-900');
        }
      } else {
        playSound('fail');
        optBtn.classList.remove('border-gray-200/80', 'bg-white');
        optBtn.classList.add('bg-red-200', 'border-red-500', 'text-red-900');
        
        const correctBtn = document.getElementById(`opt-${curQuiz.correct}`);
        if (correctBtn) {
          correctBtn.classList.remove('border-gray-200/80', 'bg-white');
          correctBtn.classList.add('bg-green-200', 'border-green-600', 'text-green-900');
        }

        if (blank) {
          blank.innerText = curQuiz.correct;
          blank.classList.remove('border-dashed', 'bg-green-50');
          blank.classList.add('bg-red-200', 'border-solid', 'text-red-900');
        }
      }

      submitBtn.innerText = quizIndex < 5 ? "다음 문제" : "결과 분석";
      submitBtn.onclick = () => {
        if (quizIndex < 5) {
          quizIndex++;
          renderQuiz();
        } else {
          showFinalResults();
        }
      };
    }

    function showFinalResults() {
      playSound('victory');
      const container = document.getElementById('activityContainer');
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.classList.add('hidden');

      const maxScore = 150;
      const pct = Math.round((score / maxScore) * 100);

      let evaluation = "";
      if (pct >= 90) {
        evaluation = "🏆 대단해요! 완벽에 가까운 실력입니다. 오늘의 리사이클링 표현 마스터!";
      } else if (pct >= 70) {
        evaluation = "🌟 아주 좋습니다! 단어의 쓰임과 맥락을 대체로 잘 이해하고 있어요.";
      } else {
        evaluation = "💪 힘내세요! 다시 한 번 시도하여 본문 내용을 복습하면 더 완벽해질 거예요.";
      }

      container.innerHTML = `
        <div class="fade-in text-center py-6 px-4 space-y-6">
          <div class="inline-block bg-green-100 p-5 rounded-full text-5xl">
            🎉
          </div>
          <div class="space-y-2">
            <h2 class="text-2xl md:text-3xl font-extrabold text-green-800">미션 완료! 수고하셨습니다.</h2>
            <p class="text-sm md:text-base text-gray-500">본문 속 6가지 필수 어휘(Phrasal Verbs) 마스터 완료!</p>
          </div>

          <div class="max-w-md mx-auto bg-green-50 border-2 border-green-200 p-6 rounded-2xl shadow-inner">
            <div class="flex justify-around items-center mb-4">
              <div>
                <span class="block text-gray-500 text-xs md:text-sm">나의 최종 점수</span>
                <span class="text-3xl md:text-4xl font-extrabold text-green-700">${score}</span> <span class="text-gray-400 font-bold">/ ${maxScore}</span>
              </div>
              <div class="h-10 w-[1px] bg-green-200"></div>
              <div>
                <span class="block text-gray-500 text-xs md:text-sm">성공도</span>
                <span class="text-3xl md:text-4xl font-extrabold text-green-700">${pct}%</span>
              </div>
            </div>
            <p class="text-sm md:text-base text-green-950 font-bold bg-white/70 py-2.5 px-4 rounded-xl">
              ${evaluation}
            </p>
          </div>

          <div class="pt-4 flex justify-center gap-3">
            <button onclick="restartActivity()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-8 rounded-2xl shadow-lg transition-all text-sm md:text-base">
              처음부터 다시 연습하기 🔄
            </button>
          </div>
        </div>
      `;
    }

    function nextStep() {
      if (currentStep < 3) {
        currentStep++;
        renderStep();
      } else {
        showFinalResults();
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        renderStep();
      }
    }

    function restartActivity() {
      currentStep = 1;
      setScore(0);
      document.getElementById('nextBtn').classList.remove('hidden');
      renderStep();
    }

    window.onload = () => {
      renderStep();
    };
  </script>
</body>
</html>
